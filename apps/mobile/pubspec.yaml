name: doran_mobile
description: 도란 대화 기록과 하루 일기
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.11.0
  flutter_riverpod: 3.5.0
  supabase_flutter: 2.18.3
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  uuid: 4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/google/g-logo.png
    - assets/google/OFL.txt
    - assets/google/TRADEMARKS.md
    - assets/fonts/SUIT-OFL.txt
  fonts:
    - family: SUIT
      fonts:
        - asset: assets/fonts/SUIT-Variable.ttf
          weight: 400
        - asset: assets/fonts/SUIT-Variable.ttf
          weight: 500
        - asset: assets/fonts/SUIT-Variable.ttf
          weight: 600
    - family: GoogleSans
      fonts:
        - asset: assets/google/GoogleSans.ttf
          weight: 500
