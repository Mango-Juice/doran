name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.5.6
      - run: deno task verify
        working-directory: supabase
      - name: Verify capture inspection without devices or playback
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare pinned disposable database image
        run: docker pull public.ecr.aws/supabase/postgres:17.6.1.158
      - name: Verify database invariants and concurrent retries
        run: bash supabase/tests/sql/run-local.sh
  car:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify publication and submitted APK signatures
        shell: bash
        run: |
          set -euo pipefail
          doran_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$doran_sdk"
          doran_analyzer=$(find "$doran_sdk/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)
          doran_signer=$(find "$doran_sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$doran_analyzer"
          test -x "$doran_signer"
          export PATH="$(dirname "$doran_analyzer"):$PATH"
          python3 scripts/verify-publication.py --json
          while IFS= read -r -d '' doran_apk; do
            "$doran_signer" verify --verbose --print-certs "$doran_apk"
          done < <(git ls-files -z -- 'apk/*.apk')
      - run: ./gradlew --no-daemon --max-workers=2 ktlintCheck testDebugUnitTest lintRelease assembleDebug
        working-directory: apps/car
  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth=1 --branch=3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: flutter analyze && flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
